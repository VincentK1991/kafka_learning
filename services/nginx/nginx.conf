events {
    worker_connections 1024;
}

http {
    upstream producer_backend {
        server producer-api:8001;
    }
    
    upstream consumer_backend {
        server consumer-api:8002;
    }
    
    upstream ai_agent_backend {
        server ai-agent:8003;
    }
    
    # Producer API
    server {
        listen 80;
        server_name producer.localhost;
        
        location / {
            proxy_pass http://producer_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    
    # Consumer API
    server {
        listen 80;
        server_name consumer.localhost;
        
        location / {
            proxy_pass http://consumer_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    
    # AI Agent API
    server {
        listen 80;
        server_name ai.localhost;
        
        location / {
            proxy_pass http://ai_agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Default server - API Gateway style routing
    server {
        listen 80 default_server;
        
        # Producer endpoints
        location /api/producer/ {
            rewrite ^/api/producer/(.*) /$1 break;
            proxy_pass http://producer_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Consumer endpoints
        location /api/consumer/ {
            rewrite ^/api/consumer/(.*) /$1 break;
            proxy_pass http://consumer_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # AI Agent endpoints
        location /api/ai/ {
            rewrite ^/api/ai/(.*) /$1 break;
            proxy_pass http://ai_agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health check endpoint
        location /health {
            return 200 '{"status":"ok","services":["producer","consumer","ai-agent"]}';
            add_header Content-Type application/json;
        }
        
        # Default redirect to documentation
        location / {
            return 302 http://$host/api/consumer/docs;
        }
    }
} 