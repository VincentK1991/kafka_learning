global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Producer API metrics
  - job_name: 'kafka-producer-api'
    static_configs:
      - targets: ['producer-api:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Consumer API metrics
  - job_name: 'kafka-consumer-api'
    static_configs:
      - targets: ['consumer-api:8002']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Kafka metrics (if JMX exporter is enabled)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']
    scrape_interval: 30s

  # System metrics (if node exporter is added)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s 