[project]
name = "kafka-data-pipeline"
version = "0.1.0"
description = "An AI-powered Kafka async queue pipeline for learning purposes"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["kafka", "ai", "data-pipeline", "streaming", "postgresql", "openai", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "kafka-python>=2.0.2",
    "psycopg2-binary>=2.9.7",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.3",
    "numpy>=1.24.3",
    "faker>=19.12.0",
    "jsonschema>=4.19.2",
    "requests>=2.31.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.19.0",
    "websockets>=12.0",
    "openai>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
kafka-producer-server = "services.producer.producer_api:start_server"
kafka-consumer-server = "services.consumer.consumer_api:start_server"
kafka-ai-agent = "services.ai_agent.ai_agent:start_server"
kafka-pipeline = "pipeline_manager:main"
# Legacy scripts (for backward compatibility)
kafka-producer = "scripts.producer:main"
kafka-consumer = "scripts.consumer:main"

[project.urls]
Homepage = "https://github.com/yourusername/kafka-data-pipeline"
Repository = "https://github.com/yourusername/kafka-data-pipeline"
Documentation = "https://github.com/yourusername/kafka-data-pipeline#readme"
Issues = "https://github.com/yourusername/kafka-data-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services", "scripts"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ipykernel>=6.29.5",
    "ruff>=0.12.4",
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
] 


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]